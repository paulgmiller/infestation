# Explicit configuration. Region and SKU default to westus2 and Standard_B2s.
# Copy these settings into an initialized stack; availability is checked by Azure.
config:
  azure-native:subscriptionId: 00000000-0000-0000-0000-000000000000
  flatcar-k3s-azure:name: flatcar-k3s-dev
  flatcar-k3s-azure:location: westus2
  flatcar-k3s-azure:flatcarVersion: REPLACE_WITH_VERIFIED_VERSION
  flatcar-k3s-azure:clusterPath: cluster.local.json
  flatcar-k3s-azure:ignitionDir: state/output
  flatcar-k3s-azure:vnetCIDR: 192.168.0.0/16
  flatcar-k3s-azure:subnetCIDR: 192.168.1.0/24
  # Choose a SKU explicitly when overriding the default.
  flatcar-k3s-azure:vmSize: Standard_B2s
  flatcar-k3s-azure:osDiskSizeGB: 32
  flatcar-k3s-azure:osDiskStorageAccountType: StandardSSD_LRS
  flatcar-k3s-azure:outboundPortsPerNode: 1024
  flatcar-k3s-azure:uniform: true
  flatcar-k3s-azure:apiCount: 3
  flatcar-k3s-azure:workerCount: 0
  flatcar-k3s-azure:privateDNSZone: flatcar-k3s-dev.westus2.internal
  # The SLB always supplies egress. This switch adds TCP/TLS API ingress.
  # Add its DNS name to cluster.json
  # tls_sans before generating Ignition: flatcar-k3s-dev-api.westus2.cloudapp.azure.com
  flatcar-k3s-azure:apiLoadBalancer: true
  flatcar-k3s-azure:apiDNSLabel: flatcar-k3s-dev-api
  flatcar-k3s-azure:apiAdminCIDRs: [0.0.0.0/0]

apiVersion: v1
kind: Namespace
metadata:
  name: lab-smoke
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
  namespace: lab-smoke
data:
  index.html: flatcar-cockroach-k3s-ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-web
  template:
    metadata:
      labels:
        app: lab-web
    spec:
      containers:
        - name: web
          image: busybox:1.37.0
          command: [httpd, -f, -p, '8080', -h, /www]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
      volumes:
        - name: www
          configMap:
            name: web
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-smoke
spec:
  selector:
    app: lab-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dns-http
  namespace: lab-smoke
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              nslookup kubernetes.default.svc.cluster.local
              test "$(wget -qO- -T 10 http://web.lab-smoke.svc.cluster.local:8080)" = flatcar-cockroach-k3s-ok
              echo 'PASS: pod DNS and HTTP through ClusterIP service'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
